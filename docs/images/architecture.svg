<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">StudyAI 系统架构图</title>
  <desc id="desc">Vue 前端、Spring Boot 业务后端、FastAPI AI Agent、MySQL、ChromaDB、本地嵌入模型和 DeepSeek 的系统架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2f6df6"/><stop offset="1" stop-color="#577ff7"/></linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142a62"/><stop offset="1" stop-color="#254a9a"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7138e8"/><stop offset="1" stop-color="#9b6bf3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#19356e" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7f91b5"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3869e8"/></marker>
    <style>
      .zh{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#14234a}.sub{font-size:16px;fill:#6e7d9d}.layer{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#7b8aaa}.name{font-size:21px;font-weight:700;fill:#fff}.body{font-size:14px;fill:#e9efff}.darkname{font-size:19px;font-weight:700;fill:#1b2a4c}.darkbody{font-size:13px;fill:#657594}.edge{font-size:12px;font-weight:600;fill:#64779d}.tag{font-size:11px;font-weight:700;fill:#4162b1}.small{font-size:12px;fill:#7182a1}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="250" fill="#dfe9ff" opacity=".52"/>
  <circle cx="105" cy="900" r="230" fill="#e9e2ff" opacity=".55"/>

  <text x="82" y="76" class="zh title">StudyAI · AI 个人知识管理与学习助手</text>
  <text x="82" y="108" class="zh sub">面向个人学习的三层解耦架构：业务数据、AI 推理与本地知识库分层运行</text>

  <text x="85" y="175" class="zh layer">PRESENTATION LAYER · 用户交互层</text>
  <g filter="url(#shadow)">
    <rect x="82" y="198" width="278" height="152" rx="22" fill="url(#front)"/>
    <circle cx="122" cy="241" r="19" fill="#fff" opacity=".18"/><path d="M114 240h16M122 232v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="154" y="245" class="zh name">Vue 3 前端</text>
    <text x="112" y="285" class="zh body">笔记编辑 · 图谱可视化</text>
    <text x="112" y="310" class="zh body">SSE 流式渲染 · 学习看板</text>
    <text x="112" y="333" class="zh body">资料导入工作流</text>
  </g>

  <text x="85" y="435" class="zh layer">BUSINESS LAYER · 业务服务层</text>
  <g filter="url(#shadow)">
    <rect x="82" y="458" width="430" height="192" rx="22" fill="url(#backend)"/>
    <circle cx="126" cy="505" r="20" fill="#fff" opacity=".15"/><path d="M117 500h18v13h-18zM121 496h10" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="160" y="512" class="zh name">Spring Boot 业务后端</text>
    <text x="112" y="553" class="zh body">JWT 鉴权 · 笔记 / 分类 / 标签 / 计划</text>
    <text x="112" y="579" class="zh body">SM-2 复习提醒 · 文档工作流状态</text>
    <text x="112" y="605" class="zh body">WebClient 代理 FastAPI SSE 流</text>
    <rect x="112" y="618" width="118" height="20" rx="10" fill="#fff" opacity=".14"/><text x="126" y="633" class="zh body" style="font-size:11px">统一 API / 权限边界</text>
  </g>

  <text x="680" y="175" class="zh layer">INTELLIGENCE LAYER · AI Agent 层</text>
  <g filter="url(#shadow)">
    <rect x="677" y="198" width="470" height="272" rx="22" fill="url(#agent)"/>
    <circle cx="722" cy="244" r="20" fill="#fff" opacity=".16"/><circle cx="722" cy="244" r="8" fill="none" stroke="#fff" stroke-width="2"/><path d="M722 225v8M722 255v8M703 244h8M733 244h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="757" y="250" class="zh name">FastAPI AI Agent</text>
    <text x="710" y="291" class="zh body">LangChain 编排 · DeepSeek 流式生成</text>
    <text x="710" y="318" class="zh body">RAG · 知识图谱 · 闪卡 · 学习计划</text>
    <text x="710" y="345" class="zh body">PDF / DOCX / TXT / Markdown 文本解析</text>
    <line x1="708" y1="370" x2="1116" y2="370" stroke="#fff" opacity=".22"/>
    <text x="710" y="399" class="zh body" style="font-size:13px;font-weight:700">双通道记忆</text>
    <text x="710" y="425" class="zh body" style="font-size:12px">短期：最近会话上下文　·　长期：历史问答向量检索</text>
    <rect x="1009" y="392" width="108" height="24" rx="12" fill="#fff" opacity=".15"/><text x="1024" y="408" class="zh body" style="font-size:11px">并行检索</text>
  </g>

  <text x="1215" y="175" class="zh layer">MODEL PROVIDER · 模型服务</text>
  <g filter="url(#shadow)">
    <rect x="1210" y="198" width="306" height="118" rx="22" fill="#fff" stroke="#d7e1f7"/>
    <circle cx="1255" cy="244" r="20" fill="#e8f1ff"/><path d="M1246 244h18M1255 235v18" stroke="#3869e8" stroke-width="2" stroke-linecap="round"/>
    <text x="1290" y="247" class="zh darkname">DeepSeek API</text>
    <text x="1235" y="283" class="zh darkbody">LLM 推理 · Token Stream</text>
  </g>

  <text x="680" y="555" class="zh layer">KNOWLEDGE &amp; DATA LAYER · 数据与知识层</text>
  <g filter="url(#shadow)">
    <rect x="677" y="578" width="254" height="150" rx="22" fill="#fff" stroke="#d7e1f7"/>
    <ellipse cx="722" cy="620" rx="20" ry="9" fill="#dce7ff" stroke="#3869e8" stroke-width="2"/><path d="M702 620v34c0 5 9 9 20 9s20-4 20-9v-34" fill="#eaf0ff" stroke="#3869e8" stroke-width="2"/><path d="M702 637c0 5 9 9 20 9s20-4 20-9" fill="none" stroke="#3869e8" stroke-width="2"/>
    <text x="760" y="628" class="zh darkname">MySQL 8</text>
    <text x="710" y="684" class="zh darkbody">用户 · 笔记 · 计划 · 复习</text>
    <text x="710" y="707" class="zh darkbody">工作流状态 · 聊天记录</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="969" y="578" width="254" height="150" rx="22" fill="#fff" stroke="#d7e1f7"/>
    <circle cx="1014" cy="626" r="22" fill="#efe9ff"/><path d="M1002 628l12-14 12 14-12 14z" fill="none" stroke="#7b4ce5" stroke-width="2"/>
    <text x="1053" y="628" class="zh darkname">ChromaDB</text>
    <text x="1002" y="684" class="zh darkbody">笔记向量 · 长期对话记忆</text>
    <text x="1002" y="707" class="zh darkbody">用户隔离 · 持久化存储</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1261" y="578" width="255" height="150" rx="22" fill="#fff" stroke="#d7e1f7"/>
    <circle cx="1306" cy="626" r="22" fill="#e5f8f1"/><path d="M1294 634l12-18 12 18M1298 628h16" fill="none" stroke="#169c73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1345" y="628" class="zh darkname">Sentence Transformers</text>
    <text x="1294" y="684" class="zh darkbody">本地嵌入模型</text>
    <text x="1294" y="707" class="zh darkbody">文本向量化，不依赖外部 API</text>
  </g>

  <path d="M360 274H565V505H650" fill="none" stroke="#3869e8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="430" y="369" width="132" height="24" rx="12" fill="#e8efff"/><text x="445" y="385" class="zh tag">REST API / SSE</text>

  <path d="M512 540H630V335H650" fill="none" stroke="#3869e8" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="540" y="432" width="120" height="24" rx="12" fill="#e8efff"/><text x="555" y="448" class="zh tag">WebClient SSE</text>

  <path d="M1147 258H1185" fill="none" stroke="#7f91b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1152" y="241" class="zh edge">LLM Stream</text>

  <path d="M821 470V548" fill="none" stroke="#7f91b5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="838" y="525" class="zh edge">业务数据</text>

  <path d="M995 470V548" fill="none" stroke="#7b4ce5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1012" y="525" class="zh edge">语义检索</text>

  <path d="M1147 394H1240V578" fill="none" stroke="#169c73" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1180" y="490" class="zh edge">文本向量化</text>

  <path d="M1261 654H1242V446H1147" fill="none" stroke="#169c73" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1167" y="548" class="zh edge">Embedding</text>

  <g transform="translate(82,808)">
    <rect width="1434" height="92" rx="20" fill="#fff" stroke="#dbe5f7"/>
    <text x="28" y="37" class="zh darkname" style="font-size:16px">核心学习闭环</text>
    <g class="zh small" font-weight="600">
      <text x="265" y="38">资料 / 笔记</text><text x="493" y="38">文档解析与向量化</text><text x="794" y="38">RAG 问答 / 闪卡</text><text x="1058" y="38">SM-2 间隔复习</text><text x="1288" y="38">学习规划</text>
    </g>
    <path d="M390 33h70" stroke="#7f91b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 33h70" stroke="#7f91b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M970 33h55" stroke="#7f91b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M1203 33h55" stroke="#7f91b5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="28" y="68" class="zh small">数据沉淀</text><text x="270" y="68" class="zh small">智能结构化</text><text x="510" y="68" class="zh small">理解与检索</text><text x="800" y="68" class="zh small">巩固记忆</text><text x="1060" y="68" class="zh small">持续行动</text>
  </g>
  <text x="82" y="946" class="zh small">StudyAI Architecture · Vue 3 / Spring Boot / FastAPI / LangChain / ChromaDB / Sentence Transformers / DeepSeek</text>
</svg>
